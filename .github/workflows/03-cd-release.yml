name: CD - Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

  IMAGE_TAG: ${{ github.ref_name }}

  SERVICE_NAME: catalog
  DEPLOYMENT_NAME: catalog-deployment

jobs:

  publish-image:

    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:

      - name: 01 - Checkout application
        uses: actions/checkout@v4

      - name: 02 - Validate tag belongs to develop branch
        run: |
          git fetch origin develop

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            echo "::error::The tag '$GITHUB_REF_NAME' is not on the develop branch."
            exit 1
          fi

      - name: 03 - Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 04 - Restore
        run: dotnet restore FiapCloudGames.Catalog.slnx

      - name: 05 - Build
        run: dotnet build FiapCloudGames.Catalog.slnx --configuration Release --no-restore

      - name: 06 - Run Tests
        run: >
          dotnet test
          FiapCloudGames.Catalog.Tests/FiapCloudGames.Catalog.Tests.csproj
          --configuration Release
          --no-build

      - name: 07 - Build Docker Image
        working-directory: ${{ github.workspace }}
        run: |
          docker build \
            -f docker/dockerfile \
            -t $ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REPOSITORY:latest \
            .      

      - name: 08 - Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 09 - Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login \
            --username AWS \
            --password-stdin \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: 10 - Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: 11 - Tag Docker Images
        run: |
          docker tag \
            $ECR_REPOSITORY:$IMAGE_TAG \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag \
            $ECR_REPOSITORY:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      - name: 12 - Push Docker Images
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

  deploy-eks:

    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest

    needs: publish-image

    steps:

      - name: 01 - Checkout Infrastructure
        uses: actions/checkout@v4
        with:
          repository: Projetos-FIAP-11NETT/fiap-cloudgames-infrastructure
          ref: feature/fase-4
          path: infrastructure

      - name: 02 - Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 03 - Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: 04 - Check cluster connection
        run: |
          kubectl get nodes

      - name: 05 - Apply Catalog API Manifests
        run: |
          kubectl apply -R -f infrastructure/k8s/$SERVICE_NAME/api

      - name: 06 - Check Deployment
        run: |
          kubectl get deployment $DEPLOYMENT_NAME

      - name: 07 - Restart Deployment
        run: |
          kubectl rollout restart deployment/$DEPLOYMENT_NAME

      - name: 08 - Wait Rollout
        run: |
          kubectl rollout status deployment/$DEPLOYMENT_NAME
